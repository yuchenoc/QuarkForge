# QuarkForge 国际化文案（默认 / English）
# 键约定：error.<错误码>，业务方可在自己的 jar 里用同名键覆盖，或通过
# I18n.setMessageSource(...) 换成数据库/配置中心实现。
error.200=success
error.40000=Invalid request parameter
error.40001=Unsupported API version
error.40100=Not authenticated or session expired
error.40300=Access denied
error.40400=The requested resource does not exist
error.40900=The same request is being processed, please retry later
error.40901=The data has been modified by another request, please refresh and retry
error.41300=Uploaded file exceeds the size limit
error.41500=Unsupported media type
error.42900=Too many requests, please retry later
error.50000=Internal server error
error.50300=Service temporarily unavailable
error.50400=Dependency service call timed out
